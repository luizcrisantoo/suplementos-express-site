# Deploy do Next.js na Netlify.
#
# Nao declare `publish` aqui: o Next.js Runtime da Netlify define a pasta de
# publicacao sozinho. Forcar `.next` faz a etapa de Deploying falhar, porque ele
# tenta subir arquivos de servidor como se fossem estaticos.
#
# O plugin tambem nao precisa ser declarado: a Netlify detecta o Next e instala.

[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# O webhook do Mercado Pago precisa chegar sem cache.
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

# As fotos de produto nao mudam: cache longo economiza banda.
[[headers]]
  for = "/produtos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
