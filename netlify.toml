# Deploy do Next.js na Netlify.
# O plugin oficial cuida das rotas de servidor, das funcoes e do cache.
[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"

# O webhook do Mercado Pago precisa chegar sem redirecionamento.
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
